name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pytest:
    name: 接口测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行 pytest
        run: python -m pytest

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装 ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

  selfcheck:
    name: 自测与语法检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 算法自测（ALPS / DTW，纯标准库，无需数据库与摄像头）
        run: python test_alps_lite.py

      - name: 后端与模块语法检查
        run: python -m py_compile zitaishibie.py alps_lite.py talma_lite_api.py

      - name: 前端关键文件存在性检查
        run: |
          test -f index.html
          test -f login.html
          test -f rehab_protocols.json
          test -f action_seed.json
